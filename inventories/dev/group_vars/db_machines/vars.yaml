---
# Overrides specific to Dev Webservers if needed (e.g. RedHat/Amazon Linux)
otel_pkg_type: "rpm"

# HAProxy Load Balancer Endpoint (used by otel_agent config)
haproxy_endpoint: "{{ hostvars[groups['haproxy_otel_lb'][0]]['ansible_host'] | default('10.0.1.30') }}:4317"

# Final backend endpoint where otel_collectors export data
otel_backend_endpoint: "jaeger-collector.otel-dev.svc.cluster.local:4317"

# # Database monitoring credentials (use vault in production)
# # For check mode, use a placeholder - replace with vault in production
# {% if vault_db_password is not defined %}
# vault_db_password: "placeholder_password"
# {% endif %}
