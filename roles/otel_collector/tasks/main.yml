---
- name: Ensure python prerequisites are installed for check mode capability
  ansible.builtin.raw: |
    if command -v apt-get >/dev/null 2>&1; then
      apt-get update && apt-get install -y python3-apt
    elif command -v dnf >/dev/null 2>&1; then
      dnf install -y python3-dnf
    else
      yum install -y python-dnf
    fi
  become: true
  changed_when: false
  check_mode: false  # Safe to leave on as it self-detects the OS engine now
- name: Ensure target directories exist
  ansible.builtin.file:
    path: "{{ otel_config_dir }}"
    state: directory
    mode: '0755'

- name: Check if local database secrets file exists on the remote server
  ansible.builtin.stat:
    path: /etc/otelcol-contrib/.env.json
  register: db_secret_file
  become: true

# - name: Read remote database secrets file
